name: Deploy site to GitHub Pages

# Publishes the contents of download/ as the site root, so the whole
# repository stays intact (scripts/, upload/ are NOT published).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (download/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: download

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
